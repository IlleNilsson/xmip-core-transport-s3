# Its own workspace root, so this repository builds on its own.
[workspace]

[package]
name = "xmip-core-transport-s3"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"
repository = "https://github.com/IlleNilsson/xmip-core-transport-s3"
description = "Amazon S3 transport: Signature Version 4 over the REST API — list a prefix, get and delete each object, put a Stream as an object — a bucket prefix is a Location. A xmip-core-transport technology."
publish = false

[lib]
path = "src/lib.rs"

[dependencies]
# A Technology depends on its parent Capability, never the reverse
# (repository-model.md).
transport = { package = "xmip-core-transport", git = "https://github.com/IlleNilsson/xmip-core-transport", branch = "main" }
# XML character data, escaped as every reader in the estate unescapes it.
codec = { package = "xmip-core-library-codec", git = "https://github.com/IlleNilsson/xmip-core-library-codec", branch = "main" }
# The endpoint parser, the request and its answer, and TLS behind the
# `tls` feature — one TLS stack in the estate, the http technology's
# (ADR-0033).
http = { package = "xmip-core-transport-http", git = "https://github.com/IlleNilsson/xmip-core-transport-http", branch = "main" }
# Signature Version 4, which this crate carried with its SHA-256 and HMAC
# until 2026-09-14; it is AWS's, and every AWS technology signs through the
# AWS crate (ADR-0044, the owner's ruling of 2026-09-22).
aws = { package = "xmip-core-transport-aws", git = "https://github.com/IlleNilsson/xmip-core-transport-aws", branch = "main" }

[features]
default = []
# HTTPS endpoints. Off by default, as it is in the http technology.
tls = ["http/tls"]

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
too_many_lines = "warn"
pedantic = { level = "warn", priority = -1 }
missing_errors_doc = "warn"
missing_panics_doc = "warn"
unwrap_used = "warn"
expect_used = "allow"
